<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Translucent Cyan/Azure Rimuru Jelly Gradient (TenSura Anime Accurate) -->
    <linearGradient id="slimeBodyGrad" x1="20" y1="20" x2="80" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="40%" stop-color="#0ea5e9" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="85%" stop-color="#2563eb" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" stop-color="#1d4ed8" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>

    <!-- Translucent Base Ambient Depth for 3D Jelly feel -->
    <radialGradient id="slimeBaseDepth" cx="50" cy="85" r="38" fx="50" fy="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.55" style="stop-color:#1e3a8a;stop-opacity:0.55" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0" style="stop-color:#1e3a8a;stop-opacity:0" />
    </radialGradient>

    <!-- Specular Highlight Shine -->
    <linearGradient id="slimeShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15" style="stop-color:#ffffff;stop-opacity:0.15" />
    </linearGradient>
  </defs>

  <!-- Ambient Floor Shadow -->
  <ellipse cx="50" cy="91" rx="36" ry="5.5" fill="#0f172a" fill-opacity="0.22" />

  <!-- Rimuru Jelly Slime Body: Chubby, Bouncy, Dome/Mochi Shaped (TenSura Anime Accurate) -->
  <path
    d="M 50 30
       C 68 30, 84 42, 87 60
       C 89 74, 82 85, 68 87
       C 58 88.5, 42 88.5, 32 87
       C 18 85, 11 74, 13 60
       C 16 42, 32 30, 50 30 Z"
    fill="url(#slimeBodyGrad)"
  />

  <!-- Internal 3D Base Ambient Depth -->
  <path
    d="M 20 72
       C 32 84, 68 84, 80 72
       C 86 81, 74 88, 50 88
       C 26 88, 14 81, 20 72 Z"
    fill="url(#slimeBaseDepth)"
  />

  <!-- Specular Jelly Surface Gloss (Signature Rimuru Shine) -->
  <ellipse cx="34" cy="39" rx="8.5" ry="3.5" transform="rotate(-28 34 39)" fill="url(#slimeShine)" />
  <circle cx="23" cy="47" r="2.2" fill="#ffffff" fill-opacity="0.75" />

  <!-- Soft Pink Cheeks -->
  <ellipse cx="28" cy="66" rx="5.5" ry="3" fill="#f43f5e" fill-opacity="0.6" />
  <ellipse cx="72" cy="66" rx="5.5" ry="3" fill="#f43f5e" fill-opacity="0.6" />

  <!-- Big Anime Eyes with Catchlights -->
  <!-- Left Eye -->
  <ellipse cx="37" cy="58" rx="4.8" ry="6.8" fill="#0f172a" />
  <circle cx="35.5" cy="55" r="2.2" fill="#ffffff" />
  <circle cx="38.8" cy="60.5" r="1.1" fill="#ffffff" />

  <!-- Right Eye -->
  <ellipse cx="63" cy="58" rx="4.8" ry="6.8" fill="#0f172a" />
  <circle cx="61.5" cy="55" r="2.2" fill="#ffffff" />
  <circle cx="64.8" cy="60.5" r="1.1" fill="#ffffff" />

  <!-- Cute Smile -->
  <path d="M 46 64 Q 50 68 54 64" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" fill="none" />
</svg>